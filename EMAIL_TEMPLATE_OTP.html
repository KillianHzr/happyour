<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Ton code Disclose</title>
  <!--[if mso]>
  <noscript>
    <xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#0C0C0D;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">

  <!-- Outer wrapper -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0C0C0D;min-height:100vh;">
    <tr>
      <td align="center" style="padding:48px 16px;">

        <!-- Card -->
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#1E1E1E;border-radius:20px;border:1px solid #2C2C2C;overflow:hidden;">

          <!-- Header stripe -->
          <tr>
            <td style="background-color:#FF561A;padding:0;height:4px;font-size:0;line-height:0;">&nbsp;</td>
          </tr>

          <!-- Logo / App name -->
          <tr>
            <td align="center" style="padding:40px 40px 0 40px;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="background-color:#FF561A;border-radius:12px;padding:10px 18px;">
                    <span style="font-size:20px;font-weight:800;color:#FFFFFF;letter-spacing:-0.5px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">Disclose</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Title -->
          <tr>
            <td align="center" style="padding:32px 40px 8px 40px;">
              <p style="margin:0;font-size:24px;font-weight:700;color:#FFFFFF;letter-spacing:-0.5px;line-height:1.2;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                Ton code de connexion
              </p>
            </td>
          </tr>

          <!-- Subtitle -->
          <tr>
            <td align="center" style="padding:0 40px 32px 40px;">
              <p style="margin:0;font-size:15px;font-weight:400;color:#949494;line-height:1.5;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                Entre ce code dans l'app pour te connecter à Disclose.
              </p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 40px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="border-top:1px solid #2C2C2C;font-size:0;line-height:0;">&nbsp;</td></tr>
              </table>
            </td>
          </tr>

          <!-- OTP Code block -->
          <tr>
            <td align="center" style="padding:40px 40px;">
              <table cellpadding="0" cellspacing="0" border="0" style="background-color:#FF561A;border-radius:14px;">
                <tr>
                  <td align="center" style="padding:20px 48px;">
                    <span style="font-size:40px;font-weight:800;color:#FFFFFF;letter-spacing:12px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">{{ .Token }}</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Expiry note -->
          <tr>
            <td align="center" style="padding:0 40px 16px 40px;">
              <p style="margin:0;font-size:13px;font-weight:400;color:#5A5A5A;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                Ce code expire dans <span style="color:#949494;font-weight:600;">5 minutes</span>.
              </p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:16px 40px 0 40px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="border-top:1px solid #2C2C2C;font-size:0;line-height:0;">&nbsp;</td></tr>
              </table>
            </td>
          </tr>

          <!-- Security note -->
          <tr>
            <td align="center" style="padding:24px 40px 40px 40px;">
              <p style="margin:0;font-size:13px;font-weight:400;color:#5A5A5A;line-height:1.6;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                Si tu n'as pas demandé ce code, ignore cet email.<br/>Ton compte reste protégé.
              </p>
            </td>
          </tr>

        </table>
        <!-- /Card -->

        <!-- Footer -->
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
          <tr>
            <td align="center" style="padding:24px 16px 0 16px;">
              <p style="margin:0;font-size:12px;color:#434343;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                © 2025 Disclose — tous droits réservés
              </p>
            </td>
          </tr>
        </table>
        <!-- /Footer -->

      </td>
    </tr>
  </table>

</body>
</html>
