name: Figma Sync - PR automatique

on:
  push:
    branches:
      - figma_link

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Créer la PR si elle n'existe pas déjà
        run: |
          existing=$(gh pr list --repo "$REPO" --head figma_link --base main --json number --jq '.[0].number')

          if [ -z "$existing" ]; then
            gh pr create \
              --repo "$REPO" \
              --base main \
              --head figma_link \
              --title "🎨 Sync Design Tokens depuis Figma" \
              --body "Push automatique depuis le plugin Figma. Vérifier les changements dans \`design-tokens.json\` avant de merger."
            echo "PR créée avec succès."
          else
            echo "PR #$existing existe déjà, aucune action."
          fi
