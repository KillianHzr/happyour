plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules'
version = '1.0.0'

android {
  namespace "expo.modules.videoconcat"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.media3:media3-transformer:1.4.1"
  implementation "androidx.media3:media3-common:1.4.1"
}
